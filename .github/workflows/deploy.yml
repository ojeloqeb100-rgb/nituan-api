# Personal-fork VPS deploy (not for QuantumNous/new-api).
# SSH to the server, fast-forward the clone, then docker compose up -d --build.
# Never run docker compose down -v (that would wipe named volumes and bind data).
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git branch or tag to deploy on the server'
        required: true
        default: 'main'
        type: string

concurrency:
  group: deploy-vps-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: SSH git pull and compose up
    if: github.repository_owner != 'QuantumNous'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          command_timeout: 40m
          envs: DEPLOY_PATH,DEPLOY_REF
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:$PATH"

            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "DEPLOY_PATH secret is empty"
              exit 1
            fi
            case "$DEPLOY_PATH" in
              /*) ;;
              *)
                echo "DEPLOY_PATH must be an absolute path"
                exit 1
                ;;
            esac
            if ! printf '%s' "${DEPLOY_REF:-}" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "Invalid DEPLOY_REF"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Tracked files have local modifications. Put server-only config in docker-compose.override.yml and .env, then retry."
              git status
              exit 1
            fi

            git fetch origin --prune --tags
            git checkout -B "$DEPLOY_REF" "origin/$DEPLOY_REF"

            compose_files="docker-compose.yml"
            if [ -f docker-compose.override.yml ]; then
              compose_files="$compose_files docker-compose.override.yml"
            fi
            if ! grep -qE '^[[:space:]]*build:' $compose_files; then
              echo "No build: section found. Copy docker-compose.prod.example.yml to docker-compose.override.yml so this fork is built from source (official calciumion/new-api does not include fork changes)."
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --build
              docker compose ps
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose up -d --build
              docker-compose ps
            else
              echo "docker compose not found"
              exit 1
            fi
